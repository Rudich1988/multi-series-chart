[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Multi-series chart backend — Django Ninja REST API"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.1"
django-ninja = "^1.3"
pydantic-settings = "^2.5"
python-dotenv = "^1.2.3"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
