[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Multi-series chart backend — Django Ninja REST API"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.1"
django-ninja = "^1.3"
python-dotenv = "^1.2.3"
django-cors-headers = "^4.9.0"
pydantic = "^2.13.5"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.7,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 85
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
